<?xml version="1.0"?>
<!-- Diagramas (v0.8): «Source Sans 3» debe ser SIEMPRE la copia de /usr/local/share/fonts
     (la misma que usa la web para medir). TeX Live trae otra versión de la misma familia
     (otf/pfb) que fontconfig también indexa: se descarta para que no se elija por sorpresa. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>/usr/local/texlive/*/texmf-dist/fonts/*/adobe/sourcesans/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
