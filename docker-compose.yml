# Estudio TFG
#
# Flujo de desarrollo (por defecto): solo el worker en Docker; server + web nativos.
#   docker compose up -d --build worker        (o: npm run worker)
#
# Despliegue completo (app + worker):
#   docker compose --profile app up -d --build
#
# Las rutas de .env (NOTES_DIR, MEMORIA_DIR…) son relativas a la raíz del repo;
# Compose las lee de .env para montar los volúmenes de la app y dentro de los
# contenedores se usan rutas fijas (/out, /data/...).
#
# El worker no monta la memoria: el server le envía un tar de las fuentes en
# cada compilación (POST /compile, application/x-tar) y recoge el PDF de /out.

name: estudio-tfg

services:
  worker:
    build: ./worker
    image: estudio-tfg-worker
    init: true                      # recoge procesos huérfanos de TeX
    ports:
      - "127.0.0.1:8090:8090"       # para el server nativo en el Mac
    volumes:
      - ./data/builds:/out
    environment:
      COMPILE_TIMEOUT_MS: "120000"
      KEEP_BUILDS: "10"
    mem_limit: 2g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,size=1g,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [latex]
    restart: unless-stopped

  app:
    profiles: [app]
    build: .
    image: estudio-tfg-app
    init: true
    depends_on: [worker]
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      NOTES_DIR: /data/notes
      MEMORIA_DIR: /data/memoria
      BUILD_DIR: /data/app/builds     # settings.json e history/ quedan en /data/app (persistentes)
      WORKER_URL: http://worker:8090
      ALLOWED_ROOTS: /data             # carpetas elegibles desde Ajustes
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ${NOTES_DIR:-./workspace/notes}:/data/notes
      - ${MEMORIA_DIR:-./workspace/memoria}:/data/memoria
      - ./data:/data/app
      - ./data/builds:/data/app/builds  # los mismos artefactos que /out del worker
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [latex, default]
    restart: unless-stopped

networks:
  # Red solo para app ↔ worker. No es `internal: true` porque Docker no publica
  # puertos de contenedores que solo están en redes internas, y en desarrollo el
  # server nativo necesita 127.0.0.1:8090. El worker no hace peticiones salientes
  # (latexmk corre con -no-shell-escape).
  latex: {}
