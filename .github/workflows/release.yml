name: App instalable offline y online

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Versión para el build de prueba (por ejemplo v0.2.1-rc.1)
        required: true
        type: string
  workflow_call:
    inputs:
      automatic:
        description: Reservar el siguiente parche y publicar tras verificar
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  version:
    name: Fijar versión y commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - id: version
        name: Reservar versión o utilizar tag explícito
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC: ${{ inputs.automatic }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$AUTOMATIC" == true ]]; then
            node scripts/desktop-version.mjs
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            node --input-type=module -e 'import {distributionTag} from "./desktop/distribution.mjs"; distributionTag(process.env.MANUAL_TAG);'
            echo "tag=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: App (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-x64 }
          - { os: windows-latest, platform: win32-x64 }
          - { os: ubuntu-latest, platform: linux-x64 }
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
            desktop/package-lock.json
            test/e2e/package-lock.json
      - name: Instalar dependencias fijadas
        run: |
          npm ci --prefix server
          npm ci --prefix web
          npm ci --prefix desktop
          for attempt in 1 2 3; do
            if node desktop/node_modules/electron/install.js; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
          done
          npm ci --prefix test/e2e
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: tex-cache
        with:
          path: ${{ runner.temp }}/tex-assets/cache
          key: tex-${{ matrix.os }}-${{ matrix.platform }}-${{ hashFiles('desktop/tex/lock.json', 'scripts/desktop-tex.mjs') }}
      - name: Preparar bibliotecas de Electron en Linux
        if: runner.os == 'Linux'
        run: cd test/e2e && npx playwright install-deps chromium
      - name: Construir interfaz y servidor
        run: npm run build --prefix web && npm run bundle --prefix server
      - name: Construir TeX y Perl privados desde el snapshot fijado
        run: npm run desktop:tex -- "$RUNNER_TEMP/tex-assets" "$RELEASE_TAG"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.tex-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/tex-assets/cache
          key: tex-${{ matrix.os }}-${{ matrix.platform }}-${{ hashFiles('desktop/tex/lock.json', 'scripts/desktop-tex.mjs') }}
      - name: Empaquetar y verificar ambas variantes reales
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for variant in offline online; do
            npm run desktop:build -- "$RUNNER_TEMP/tex-assets" "$RELEASE_TAG" "$variant"
            if [[ "$RUNNER_OS" == Linux ]]; then
              xvfb-run -a npm run desktop:verify -- "desktop/dist/${{ matrix.platform }}/$variant" "$RUNNER_TEMP/tex-assets"
            else
              npm run desktop:verify -- "desktop/dist/${{ matrix.platform }}/$variant" "$RUNNER_TEMP/tex-assets"
            fi
          done
      - name: Conservar paquetes y evidencia de cada plataforma
        if: '!cancelled()'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribucion-${{ matrix.platform }}
          path: |
            desktop/dist/${{ matrix.platform }}/*/release/*.dmg
            desktop/dist/${{ matrix.platform }}/*/release/*.zip
            desktop/dist/${{ matrix.platform }}/*/release/*.exe
            desktop/dist/${{ matrix.platform }}/*/release/*.AppImage
            desktop/dist/${{ matrix.platform }}/*/release/*.blockmap
            desktop/dist/${{ matrix.platform }}/*/release/*.yml
            desktop/dist/${{ matrix.platform }}/*/verificacion.json
            desktop/dist/${{ matrix.platform }}/*/app.log
            desktop/dist/${{ matrix.platform }}/*/compile-error.log
            desktop/dist/${{ matrix.platform }}/*/latexmk-error.log
            desktop/dist/${{ matrix.platform }}/*/error.txt
            desktop/dist/${{ matrix.platform }}/*/*.png
            desktop/dist/${{ matrix.platform }}/*/biblioteca/*.json
            ${{ runner.temp }}/tex-assets/*.tar.gz
            ${{ runner.temp }}/tex-assets/engine-*.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft:
    name: Preparar y entregar release verificada
    needs: [version, build]
    if: inputs.automatic || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: publicar-distribucion
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --prefix server
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: distribucion-*
          path: artifacts
      - name: Reunir manifiestos, tamaños y evidencias
        run: node scripts/desktop-release.mjs artifacts release "$RELEASE_TAG"
      - name: Preparar borradores o publicar la entrega de main
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC: ${{ inputs.automatic }}
        run: |
          if [[ "$AUTOMATIC" == true ]]; then
            node scripts/desktop-deliver.mjs release "$RELEASE_TAG" --publish
            node scripts/desktop-publish.mjs "$RELEASE_TAG"
          else
            node scripts/desktop-deliver.mjs release "$RELEASE_TAG"
          fi
