name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Comprobaciones (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # Los tests de plantilla leen la versión histórica v0.3.
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
            test/e2e/package-lock.json
      - name: Instalar API
        run: npm ci --prefix server
      - name: Instalar web
        run: npm ci --prefix web
      - name: Typecheck de la API
        run: npm run typecheck --prefix server
      - name: Tests del lanzador y de la API
        run: npm test
      - name: Typecheck y build de la web
        run: npm run build --prefix web
      - name: Instalar pruebas de navegador
        run: npm ci --prefix test/e2e
      - name: Instalar Chromium
        working-directory: test/e2e
        run: npx playwright install --with-deps chromium
      - name: Recorridos básicos de biblioteca y conflictos
        run: npm run test:e2e -- --grep "@smoke"
      - name: Conservar evidencias de navegador al fallar
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: biblioteca-smoke-${{ matrix.os }}
          path: |
            test/e2e/test-results/
            test/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Tests del worker
        run: node --test worker/*.test.mjs
      - name: Manifiesto de plantilla
        run: node scripts/template-manifest.mjs --check

  template:
    name: Plantilla y biblioteca (Chromium y worker real)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
            test/e2e/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix web
      - run: npm ci --prefix test/e2e
      - run: npm run build --prefix web
      - name: Instalar Chromium para los recorridos completos
        working-directory: test/e2e
        run: npx playwright install --with-deps chromium
      - name: Preparar carpeta de artefactos temporales
        run: |
          echo "TEMPLATE_OUT=$RUNNER_TEMP/estudio-tfg-template" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/estudio-tfg-template"
          mkdir -p "$RUNNER_TEMP/estudio-tfg-template/diagramas-browser"
      - name: Construir el worker
        run: docker build --pull --tag estudio-tfg-worker:ci worker
      - name: Arrancar el worker aislado
        run: |
          mkdir -p "$TEMPLATE_OUT"
          docker run --detach --init --name estudio-tfg-ci-worker --user "$(id -u):$(id -g)" --publish 127.0.0.1:8097:8090 --volume "$TEMPLATE_OUT:/out" --env COMPILE_TIMEOUT_MS=30000 --read-only --tmpfs /tmp:rw,exec,nosuid,size=1g,mode=1777 --cap-drop ALL --security-opt no-new-privileges --memory 2g --pids-limit 256 estudio-tfg-worker:ci
      - name: Esperar a que el worker esté listo
        run: |
          node --input-type=module -e '
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                const response = await fetch("http://127.0.0.1:8097/health", { signal: AbortSignal.timeout(1000) });
                if (response.ok && (await response.json()).ok) process.exit(0);
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 250));
            }
            throw new Error("El worker de prueba no terminó de arrancar");
          '
      - name: Verificar configuraciones y límites de acceso con fuentes ficticias
        run: WORKER_SECURITY_URL=http://127.0.0.1:8097 WORKER_SECURITY_OUT="$TEMPLATE_OUT" node --test worker/security.integration.test.mjs
      - name: Compilar todos los perfiles y exigir cero avisos
        run: node scripts/compile-template.mjs --worker-url http://127.0.0.1:8097 --output-dir "$TEMPLATE_OUT"
      - name: Verificar citas, figuras y memoria trasladada sin biblioteca
        run: node server/node_modules/tsx/dist/cli.mjs scripts/library-compile.mts --worker-url http://127.0.0.1:8097 --output-dir "$TEMPLATE_OUT"
      - name: Verificar el motor local con TeX real sin worker HTTP
        run: |
          mkdir -p "$TEMPLATE_OUT/native/builds"
          for fixture in local-engine-security.mts library-compile.mts; do
            docker run --rm --init --user "$(id -u):$(id -g)" --network none \
              --read-only --tmpfs /tmp:rw,exec,nosuid,size=1g,mode=1777 \
              --cap-drop ALL --security-opt no-new-privileges --memory 2g --pids-limit 256 \
              --env RUNNER_TEMP=/out --volume "$TEMPLATE_OUT/native:/out" \
              --volume "$GITHUB_WORKSPACE/server/src:/repo/server/src:ro" \
              --volume "$GITHUB_WORKSPACE/server/package.json:/repo/server/package.json:ro" \
              --volume "$GITHUB_WORKSPACE/server/node_modules:/repo/server/node_modules:ro" \
              --volume "$GITHUB_WORKSPACE/worker:/repo/worker:ro" \
              --volume "$GITHUB_WORKSPACE/scripts:/repo/scripts:ro" \
              --volume "$GITHUB_WORKSPACE/web/src/lib/diagramTemplates.ts:/repo/web/src/lib/diagramTemplates.ts:ro" \
              --volume "$GITHUB_WORKSPACE/templates:/repo/templates:ro" \
              --entrypoint node estudio-tfg-worker:ci --experimental-transform-types \
              "/repo/scripts/$fixture" --engine local --output-dir /out/builds
          done
      - name: Recorridos E2E de biblioteca, recuperación y PDF
        # La exportación local con PATH vacío deja figuras ficticias para compilarlas después.
        run: npm run test:e2e
        env:
          E2E_WORKER_URL: http://127.0.0.1:8097
          E2E_WORKER_OUT: ${{ env.TEMPLATE_OUT }}
          E2E_DIAGRAM_OUT: ${{ env.TEMPLATE_OUT }}/diagramas-browser
      - name: Compilar las seis figuras del navegador en ambos perfiles
        run: node server/node_modules/tsx/dist/cli.mjs scripts/library-compile.mts --worker-url http://127.0.0.1:8097 --output-dir "$TEMPLATE_OUT" --diagrams-dir "$TEMPLATE_OUT/diagramas-browser"
      - name: Conservar evidencias E2E al fallar
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: biblioteca-e2e-linux
          path: |
            test/e2e/test-results/
            test/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Guardar log del worker y detenerlo
        if: always()
        run: |
          if docker inspect estudio-tfg-ci-worker >/dev/null 2>&1; then
            docker logs estudio-tfg-ci-worker > "$TEMPLATE_OUT/worker.log" 2>&1
            docker rm --force estudio-tfg-ci-worker
          fi
      - name: Conservar diagnósticos y logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plantilla-diagnosticos
          path: |
            ${{ env.TEMPLATE_OUT }}/resultado-*.json
            ${{ env.TEMPLATE_OUT }}/**/*.log
            ${{ env.TEMPLATE_OUT }}/**/latexmk.txt
            ${{ env.TEMPLATE_OUT }}/native/**/resultado-*.json
            ${{ env.TEMPLATE_OUT }}/native/**/herramientas-locales.json
            ${{ env.TEMPLATE_OUT }}/diagramas-browser/*.pdf
          if-no-files-found: ignore
          retention-days: 7
